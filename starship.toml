# =========================
# STARSHIP CONFIG
# =========================

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character
"""

add_newline = true


[os]
disabled = false
style = "bold purple"


[username]
show_always = true
style_user = "bold cyan"
format = "[$user]($style) "


[hostname]
ssh_only = false
format = "on [$hostname](bold blue) "


[directory]
style = "bold purple"
format = "[$path]($style) "
truncation_length = 3


[git_branch]
symbol = " "
style = "bold green"


[git_status]
style = "bold yellow"


[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
